name: Jenkins connector acceptance

on:
  push:
    branches: [codex/jenkins-296-ci]
    paths:
      - packages/connector/jenkins/**
      - .github/workflows/jenkins-connector-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jenkins-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    if: github.repository == 'ShenJun93/cognee-community'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.10', '3.13']
    defaults:
      run:
        working-directory: packages/connector/jenkins
        shell: bash
    env:
      UV_NO_CACHE: '1'
      UV_PYTHON_DOWNLOADS: never
      DO_NOT_TRACK: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      TELEMETRY_DISABLED: 'true'
      RUNTIME__DLTHUB_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install resolver
        run: |
          python -m pip install uv
          uv --version
          python --version
      - name: Verify Ubuntu generated lock
        run: uv lock --check
      - name: Record generated lock without artifact storage
        if: matrix.python == '3.11'
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          data = Path('uv.lock').read_bytes()
          print('JENKINS_LOCK_SHA256=' + hashlib.sha256(data).hexdigest())
          encoded = base64.b64encode(gzip.compress(data, mtime=0)).decode()
          print('JENKINS_LOCK_GZIP_BASE64_BEGIN')
          for start in range(0, len(encoded), 2048):
              print(encoded[start:start + 2048])
          print('JENKINS_LOCK_GZIP_BASE64_END')
          PY
      - name: Fresh isolated locked install
        run: |
          uv sync --locked --python '${{ matrix.python }}'
          uv pip install --python .venv/bin/python pytest pytest-asyncio ruff
          uv pip freeze --python .venv/bin/python
      - name: Complete listing deletion contract
        run: .venv/bin/python -m pytest tests/test_complete_listing.py -q -ra
      - name: Lint and format
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
      - name: Build wheel and smoke-test example without credentials
        run: |
          uv build --wheel
          env -u JENKINS_URL -u JENKINS_USER -u JENKINS_API_TOKEN .venv/bin/python examples/example.py
      - name: Real Jenkins and DLT regression
        run: .venv/bin/python -m pytest tests/test_jenkins.py -q -ra --junitxml=jenkins-results.xml
      - name: Real Cognee memory acceptance
        if: matrix.python == '3.11'
        run: .venv/bin/python -m pytest tests/ --run-jenkins-memory -q -ra -s --junitxml=acceptance-results.xml
      - name: Record test evidence in logs
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ('jenkins-results.xml', 'acceptance-results.xml'):
              path = Path(name)
              if path.exists():
                  print(name)
                  print(path.read_text())
          PY

